name: Deploy to Server

on:
    workflow_run:
        workflows: ['CI']
        types:
            - completed
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        concurrency:
            group: deploy
            cancel-in-progress: false
        if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_branch || github.ref }}

            - name: Setup SSH
              env:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  SERVER_HOST: ${{ secrets.SERVER_HOST }}
              run: |
                  set -euo pipefail
                  if [ -z "${SSH_PRIVATE_KEY}" ] || [ -z "${SERVER_HOST}" ]; then
                      echo "ERROR: Required deployment secrets are not configured."
                      exit 1
                  fi

                  install -d -m 700 ~/.ssh
                  printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

                  touch ~/.ssh/known_hosts
                  chmod 600 ~/.ssh/known_hosts
                  if ! ssh-keyscan -H "${SERVER_HOST}" >> ~/.ssh/known_hosts 2>/dev/null; then
                      echo "ERROR: Could not obtain the deployment server host key."
                      exit 1
                  fi

            - name: Test SSH connection
              env:
                  SERVER_HOST: ${{ secrets.SERVER_HOST }}
              run: |
                  set -euo pipefail
                  ssh -i ~/.ssh/deploy_key \
                      -o BatchMode=yes \
                      -o IdentitiesOnly=yes \
                      -o PreferredAuthentications=publickey \
                      -o ConnectTimeout=10 \
                      "root@${SERVER_HOST}" true

            - name: Deploy to server
              timeout-minutes: 15
              env:
                  SERVER_HOST: ${{ secrets.SERVER_HOST }}
              run: |
                  set -euo pipefail
                  ssh -i ~/.ssh/deploy_key \
                      -o BatchMode=yes \
                      -o IdentitiesOnly=yes \
                      -o PreferredAuthentications=publickey \
                      "root@${SERVER_HOST}" 'bash -se' <<'REMOTE'
                  PROJECT_DIR="/var/www/first-calc"
                  mkdir -p "${PROJECT_DIR}"
                  cd "${PROJECT_DIR}"

                  if [ -d .git ]; then
                      echo "Updating repository..."
                      git fetch origin
                      git reset --hard origin/main
                  else
                      echo "Cloning repository..."
                      git clone https://github.com/alex1c/first-calc.git .
                  fi

                  bash scripts/deploy-production.sh
                  REMOTE
