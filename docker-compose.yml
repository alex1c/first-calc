services:
  first-calc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: first-calc
    restart: unless-stopped
    ports:
      - '3003:3000'
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_DATA_SOURCE=local
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-https://first-calc.com}
      - NEXT_PUBLIC_ENV=${NEXT_PUBLIC_ENV:-production}
    # Check the Next.js server inside the container without external tools or DNS.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "const http=require('http');const request=http.get({host:'127.0.0.1',port:3000,path:'/'},response=>{response.resume();process.exit(response.statusCode===200?0:1)});request.setTimeout(5000,()=>{request.destroy();process.exit(1)});request.on('error',()=>process.exit(1));",
        ]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 30s
    # Optional: Add volumes for persistent data if needed
    # volumes:
    #   - ./data:/app/data
